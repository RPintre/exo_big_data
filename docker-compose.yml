services:
  kafka:
    image: apache/kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafkaSecrets:/etc/kafka/secrets
      - kafkaData:/var/lib/kafka/data
    env_file: kafka.env  

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.4.1
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - PYSPARK_SUBMIT_ARGS=--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1 pyspark
    depends_on:
      - kafka
  

volumes:
  kafkaData:
  kafkaSecrets: